[package]
name = "bypath-desktop"
version = "0.4.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "bypath_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bypath-gui"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
bypath-core = { path = "../../../crates/bypath-core" }
bypath-daemon = { path = "../../../crates/bypath-daemon" }
bypath-ipc = { path = "../../../crates/bypath-ipc" }
bypath-windivert = { path = "../../../crates/bypath-windivert" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
