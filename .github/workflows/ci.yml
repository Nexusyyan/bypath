name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: Pure 7-bit ASCII Source Gate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify pure 7-bit ASCII across source files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exts = @(".rs", ".ts", ".tsx", ".js", ".jsx", ".css", ".py", ".ps1", ".yml", ".yaml")
          $violations = @()
          foreach ($f in (git ls-files)) {
            $ext = [System.IO.Path]::GetExtension($f).ToLowerInvariant()
            if ($exts -contains $ext) {
              $bytes = [System.IO.File]::ReadAllBytes($f)
              if ($bytes | Where-Object { $_ -gt 127 } | Select-Object -First 1) {
                $violations += $f
              }
            }
          }
          if ($violations.Count -gt 0) {
            Write-Error ("Non-ASCII bytes found in source files: " + ($violations -join ", "))
            exit 1
          }
          Write-Host "Pure 7-bit ASCII check passed."

  rust:
    name: Rust Core, Daemon & CLI (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release binaries
        run: cargo build --workspace --release

  desktop:
    name: Desktop GUI (Tauri v2 + React)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Desktop Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm --prefix apps/desktop ci

      - name: Run frontend typecheck, unit tests, and build
        run: |
          npm --prefix apps/desktop run typecheck
          npm --prefix apps/desktop test
          npm --prefix apps/desktop run build

      - name: Run Tauri Clippy (deny warnings)
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Check Tauri release build
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --release
