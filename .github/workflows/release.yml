name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version label for manual build (e.g. v0.4.0)"
        required: false
        default: "dev"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build & Package Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.tag }}") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "dev"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Fetch and verify official signed WinDivert 2.2.2-A runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\fetch-windivert.ps1

      - name: Run workspace test suite
        run: cargo test --workspace

      - name: Build CLI and Windows Service Daemon
        run: cargo build --workspace --release

      - name: Build Desktop GUI (Tauri v2)
        run: |
          npm --prefix apps/desktop ci
          npm --prefix apps/desktop test
          npm --prefix apps/desktop run tauri:build

      - name: Stage out-of-the-box and no-driver bundles with checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.meta.outputs.tag }}"
          $distDir = "dist-release"
          $fullStage = Join-Path $distDir "bypath-$tag-windows-x64"
          $liteStage = Join-Path $distDir "bypath-$tag-windows-x64-nodriver"

          foreach ($stage in @($fullStage, $liteStage)) {
            $skillsDir = Join-Path $stage "skills\bypath-agent"
            New-Item -ItemType Directory -Force -Path $skillsDir | Out-Null

            Copy-Item "target\release\bypath.exe" $stage
            Copy-Item "target\release\bypath-daemon.exe" $stage
            Copy-Item "apps\desktop\src-tauri\target\release\bypath-gui.exe" $stage
            Copy-Item "config.example.toml" $stage
            Copy-Item "README.md" $stage
            Copy-Item "README.zh-CN.md" $stage
            Copy-Item "LICENSE-MIT" $stage
            Copy-Item "LICENSE-APACHE" $stage
            Copy-Item "THIRD_PARTY_NOTICES.md" $stage
            Copy-Item "skills\bypath-agent\SKILL.md" $skillsDir
          }

          # Full out-of-the-box bundle: include ONLY official signed WinDivert.dll + WinDivert64.sys
          # and full LGPLv3/GPLv3 license texts (zero sample tools).
          $wdStage = Join-Path $fullStage "runtime\windivert"
          New-Item -ItemType Directory -Force -Path $wdStage | Out-Null
          Copy-Item "runtime\windivert\WinDivert.dll" $wdStage
          Copy-Item "runtime\windivert\WinDivert64.sys" $wdStage
          foreach ($doc in @("WINDIVERT_LICENSE.txt", "WINDIVERT_README.txt")) {
            $src = Join-Path "runtime\windivert" $doc
            if (Test-Path $src) {
              Copy-Item $src $wdStage
            }
          }

          # Clean no-driver bundle: includes fetch script for restricted AV environments.
          $liteScripts = Join-Path $liteStage "scripts"
          New-Item -ItemType Directory -Force -Path $liteScripts | Out-Null
          Copy-Item "scripts\fetch-windivert.ps1" $liteScripts

          $fullZip = Join-Path $distDir "bypath-$tag-windows-x64.zip"
          $liteZip = Join-Path $distDir "bypath-$tag-windows-x64-nodriver.zip"
          Compress-Archive -Path "$fullStage\*" -DestinationPath $fullZip -Force
          Compress-Archive -Path "$liteStage\*" -DestinationPath $liteZip -Force

          # Expose standalone executables for power users and CLI upgrades
          Copy-Item "target\release\bypath.exe" (Join-Path $distDir "bypath-$tag-windows-x64.exe")
          Copy-Item "target\release\bypath-daemon.exe" (Join-Path $distDir "bypath-daemon-$tag-windows-x64.exe")
          Copy-Item "apps\desktop\src-tauri\target\release\bypath-gui.exe" (Join-Path $distDir "bypath-gui-$tag-windows-x64.exe")

          $checksumFile = Join-Path $distDir "SHA256SUMS.txt"
          Get-ChildItem -Path $distDir -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Out-File -FilePath $checksumFile -Encoding ascii

          Get-Content $checksumFile

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bypath-${{ steps.meta.outputs.tag }}-windows-x64
          path: |
            dist-release/*.zip
            dist-release/*.exe
            dist-release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/*.zip
            dist-release/*.exe
            dist-release/SHA256SUMS.txt
          body: |
            ## Bypath ${{ steps.meta.outputs.tag }} (Windows x64)

            ### Quick Start (Recommended Out-of-the-Box Bundle)
            1. Download and extract **`bypath-${{ steps.meta.outputs.tag }}-windows-x64.zip`** (includes official SHA-256 & Authenticode verified `WinDivert.dll` + `WinDivert64.sys` under `runtime/windivert/` with full LGPLv3 notices).
            2. Double-click **`bypath-gui.exe`**.
            3. Edit your upstream proxy address if needed (e.g. `127.0.0.1:7897` or `127.0.0.1:10808`), toggle your apps (such as Antigravity), and switch directly between **Off**, **Foreground** (in-app with automatic UAC elevation), and **Background** (`BypathService` persistent mode with zero daily UAC) from the sidebar or system tray popover. Optional **Launch at Windows Startup** (off by default) and one-click SHA-256 verified **In-App Updates (Restart to Update)** are built into Diagnostics.

            ### Clean No-Driver Bundle
            If your antivirus flags kernel packet drivers in ZIP archives, download **`bypath-${{ steps.meta.outputs.tag }}-windows-x64-nodriver.zip`** and run `.\scripts\fetch-windivert.ps1` (or locate your own `WinDivert.dll` + `WinDivert64.sys` from Diagnostics).

            ### AI Agent / DIY Automation
            Connect Antigravity, Claude Code, or Cursor to `bypath.exe mcp` (built-in stdio MCP server) or call `bypath.exe ctl --json ...`. See `skills/bypath-agent/SKILL.md` inside the archive.

            > **Integrity**: Verify all downloads against `SHA256SUMS.txt`.
