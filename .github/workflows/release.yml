name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version label for manual build (e.g. v0.3.0)"
        required: false
        default: "dev"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build & Package Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.tag }}") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "dev"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Run workspace test suite
        run: cargo test --workspace

      - name: Build CLI and Windows Service Daemon
        run: cargo build --workspace --release

      - name: Build Desktop GUI (Tauri v2)
        run: |
          npm --prefix apps/desktop ci
          npm --prefix apps/desktop run tauri:build

      - name: Stage portable bundle and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.meta.outputs.tag }}"
          $distDir = "dist-release"
          $stageDir = Join-Path $distDir "bypath-$tag-windows-x64"
          $scriptsDir = Join-Path $stageDir "scripts"

          New-Item -ItemType Directory -Force -Path $scriptsDir | Out-Null

          Copy-Item "target\release\bypath.exe" $stageDir
          Copy-Item "target\release\bypath-daemon.exe" $stageDir
          Copy-Item "apps\desktop\src-tauri\target\release\bypath-gui.exe" $stageDir
          Copy-Item "config.example.toml" $stageDir
          Copy-Item "README.md" $stageDir
          Copy-Item "README.zh-CN.md" $stageDir
          Copy-Item "LICENSE-MIT" $stageDir
          Copy-Item "LICENSE-APACHE" $stageDir
          Copy-Item "THIRD_PARTY_NOTICES.md" $stageDir
          Copy-Item "scripts\fetch-windivert.ps1" $scriptsDir

          $zipPath = Join-Path $distDir "bypath-$tag-windows-x64.zip"
          Compress-Archive -Path "$stageDir\*" -DestinationPath $zipPath -Force

          # Also expose standalone executables for direct download
          Copy-Item "target\release\bypath.exe" (Join-Path $distDir "bypath-$tag-windows-x64.exe")
          Copy-Item "target\release\bypath-daemon.exe" (Join-Path $distDir "bypath-daemon-$tag-windows-x64.exe")
          Copy-Item "apps\desktop\src-tauri\target\release\bypath-gui.exe" (Join-Path $distDir "bypath-gui-$tag-windows-x64.exe")

          $checksumFile = Join-Path $distDir "SHA256SUMS.txt"
          Get-ChildItem -Path $distDir -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Out-File -FilePath $checksumFile -Encoding ascii

          Get-Content $checksumFile

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bypath-${{ steps.meta.outputs.tag }}-windows-x64
          path: |
            dist-release/*.zip
            dist-release/*.exe
            dist-release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/*.zip
            dist-release/*.exe
            dist-release/SHA256SUMS.txt
          body: |
            ## Bypath ${{ steps.meta.outputs.tag }} (Windows x64)

            ### Quick Start
            1. Extract `bypath-${{ steps.meta.outputs.tag }}-windows-x64.zip`.
            2. Run `.\scripts\fetch-windivert.ps1` once to download and verify the official signed WinDivert 2.2.2-A runtime (`WinDivert.dll` + `WinDivert64.sys`, LGPLv3).
            3. Install the background Windows Service once (`.\bypath.exe service install && .\bypath.exe service start`, or via **Diagnostics -> Install & Start Service** inside `bypath-gui.exe`).
            4. Launch `bypath-gui.exe` as a standard user.

            > **Integrity**: Verify downloads against `SHA256SUMS.txt`. WinDivert binaries are intentionally fetched directly from the official release with SHA-256 and Authenticode verification to keep LGPLv3 compliance clean and avoid false-positive AV quarantines on the release bundle.
